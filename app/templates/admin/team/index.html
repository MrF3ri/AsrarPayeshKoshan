{% extends 'admin/base.html' %}{% block content %}<div class='d-flex justify-content-between mb-3'><h4>اعضای تیم</h4><a class='btn btn-primary' href='{{ url_for("admin.team_create") }}'>افزودن</a></div><table class='table table-striped'><tr><th>نام</th><th>سمت</th><th>عملیات</th></tr>{% for m in team_list %}<tr><td>{{m.name}}</td><td>{{m.position}}</td><td><a href='{{url_for("admin.team_edit",id=m.id)}}' class='btn btn-sm btn-warning'>ویرایش</a> <a href='{{url_for("admin.team_delete",id=m.id)}}' class='btn btn-sm btn-danger'>حذف</a></td></tr>{% endfor %}</table>{% endblock %}
