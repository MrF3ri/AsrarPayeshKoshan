{% extends 'admin/base.html' %}{% block content %}<div class='d-flex justify-content-between mb-3'><h4>مدیریت آمار</h4><a class='btn btn-primary' href='{{ url_for("admin.stats_create") }}'>افزودن</a></div><table class='table table-striped'><tr><th>عنوان</th><th>وضعیت</th><th>عملیات</th></tr>{% for i in stats %}<tr><td>{{ i.title or i.name }}</td><td>{{ 'فعال' if i.active else 'غیرفعال' }}</td><td><a class='btn btn-sm btn-warning' href='{{ url_for("admin.stats_edit", id=i.id) }}'>ویرایش</a> <a class='btn btn-sm btn-danger' href='{{ url_for("admin.stats_delete", id=i.id) }}'>حذف</a></td></tr>{% endfor %}</table>{% endblock %}
