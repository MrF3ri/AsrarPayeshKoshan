{% extends "base.html" %}
{% block container %}
<section class="container mt-4">
  <h4 class="bt-color">آرشیو اخبار</h4>
  {% for news in news_items %}
  <div class="card my-3 p-3">
    <a href="{{ url_for('routeapi.news_detail', news_id=news.id) }}"><h5>{{ news.title }}</h5></a>
    <p>{{ news.short_description }}</p>
  </div>
  {% else %}<p>خبری ثبت نشده است.</p>{% endfor %}
</section>
{% endblock %}
