<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title id="page-title">بارگذاری...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="{{ url_for('static', filename='Css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='Css/bootstrap-rtl.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='Css/Style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='Css/sina-nav.min.css') }}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='Css/owl-carousel/owl.carousel.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='Css/owl-carousel/owl.theme.default.min.css') }}">
</head>

    
<body id="{{ page_id }}">

    <!-- بالای صفحه -->
    <section id="tophead" class="container-fluid p-2 grad-bg">
        <div class="container">
            <div class="row">
                <div class="col-lg-8 col-sm-5 d-lg-block d-none">
                <a href="#" class="d-flex align-items-center" style="width:100%; height:100%;">
                    <img src="{{ url_for('static', filename='Images/logo2.png') }}" class="img-fluid" 
                        style="max-width:90px; width:auto; height:auto;" />
                    <img src="{{ url_for('static', filename='Images/name.png') }}" class="img-fluid" 
                        style="max-width:150px; width:auto; height:auto;" />
                </a>
                </div>

                <div class="col-lg-3 col-6 mr-auto">
                    <div class="d-flex flex-column">
                        <span class="text-white" id="today-date"></span>
                        <form class="d-sm-block d-none">
                            <div class="input-group mb-3">
                                <input type="text" class="form-control" placeholder="جستجو .."
                                    onfocus="this.placeholder = ''" onblur="this.placeholder = 'جستجو ..'">
                                <div class="input-group-prepend">
                                    <button class="btn btn-success" type="submit"><i class="fa fa-search"></i></button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-lg-1 col-6 text-left mb-3">
                    <img src="{{ url_for('static', filename='Images/flag.png') }}" class="pt-sm-4 flag img-fluid" />
                </div>
            </div>
        </div>
    </section>

    <!-- منو -->
    <header class="nav-container">
        <nav class="sina-nav mobile-sidebar navbar-fixed" data-top="60">
            <div class="container">
                <div class="collapse navbar-collapse" id="navbar-menu">
                    <ul class="sina-menu sina-menu-center">
                        <li><a href="/">صفحه اصلی</a></li>

                        <li><a href="/ourteam">معرفی مدیران</a></li>
                        {#
                        <li class="dropdown">
                            <a href="#" class="dropdown-toggle" data-toggle="dropdown">سایر برگه ها</a>
                            <ul class="dropdown-menu">
                                <li><a href="Service.html">خدمات</a></li>
                                <li><a href="Success.html">ثبت موفق</a></li>
                                <li><a href="UnSuccess.html">ثبت ناموفق</a></li>
                                <li><a href="Waiting.html">صفحه انتظار</a></li>
                                <li><a href="Blank.html">صفحه خالی</a></li>
                            </ul>
                        </li>
                        #}

                        <li><a href="AboutUs.html">درباره ما</a></li>
                        <li><a href="ContactUs.html">ارتباط با ما</a></li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>


    {% block container %}{% endblock %}

    <!-- فوتر -->
    <footer class="rel-footer">
        <div id="footer-content">
            <div class="container">
                <div class="row pt-4 mx-2" id="footer-dynamic">

                </div>
            </div>
        </div>
        <div id="footer-copyright">
            <div class="container text-center">
                <p href="#" class="text-white">کلیه حقوق این قالب برای <a href="mrferi.ir" class="text-white">feri</a> محفوظ می باشد.</p>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='Js/page/home.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.1/umd/popper.min.js"></script>
    <script src="{{ url_for('static', filename='Js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='Js/sina-nav.min.js') }}"></script>
    <script src="{{ url_for('static', filename='Js/owl.carousel.js') }}"></script>
    <script>
$(document).ready(function(){
    $("#owl-slider").owlCarousel({
        items: 1,
        loop: true,
        nav: true,
        dots: true,
        autoplay: true,
        autoplayTimeout: 3000,
        autoplayHoverPause: true
    });

    $("#owl-Service").owlCarousel({
        loop: true,
        margin: 10,
        nav: true,
        dots: true,
        responsive: {
            0: { items: 1 },       // موبایل
            576: { items: 2 },     // موبایل بزرگ
            768: { items: 3 },     // تبلت
            992: { items: 4 },     // دسکتاپ کوچک
            1200: { items: 5 }     // دسکتاپ بزرگ
        }
    });
    
    $("#owl-topnews").owlCarousel({
        loop: true,
        margin: 10,
        nav: true,
        dots: true,
        autoplay: true,
        autoplayTimeout: 3000,
        autoplayHoverPause: true,
        responsive: {
            0: { items: 1 },       // موبایل
            576: { items: 2 },     // موبایل بزرگ
            768: { items: 3 },     // تبلت
            992: { items: 4 },     // دسکتاپ کوچک
            1200: { items: 5 }     // دسکتاپ بزرگ
        }
    });
});

    </script>


</body>
</html>
